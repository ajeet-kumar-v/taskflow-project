<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>TaskFlow Manager</h1>
        
        <div class="task-form">
            <input type="text" id="taskTitle" placeholder="Task Title..." required>
            <input type="text" id="taskDesc" placeholder="Description...">
            <button onclick="addTask()">Add Task</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = "/tasks/";

        async function fetchTasks() {
            const response = await fetch(API_URL);
            const tasks = await response.json();
            const taskList = document.getElementById("taskList");
            taskList.innerHTML = "";
            
            tasks.forEach(task => {
                const li = document.createElement("li");
                li.className = task.completed ? "completed" : "";
                li.innerHTML = `
                    <span><strong>${task.title}</strong>: ${task.description || ''}</span>
                    <div>
                        <button onclick="toggleTask(${task.id}, '${task.title}', '${task.description || ''}', ${!task.completed})">${task.completed ? 'Undo' : 'Done'}</button>
                        <button onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;
                taskList.appendChild(li);
            });
        }

        async function addTask() {
            const title = document.getElementById("taskTitle").value;
            const description = document.getElementById("taskDesc").value;
            
            if (!title) return alert("Please enter a task title");

            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, description, completed: false })
            });

            document.getElementById("taskTitle").value = "";
            document.getElementById("taskDesc").value = "";
            fetchTasks();
        }

        async function toggleTask(id, title, description, completed) {
            await fetch(`${API_URL}${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, description, completed })
            });
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`${API_URL}${id}`, { method: "DELETE" });
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
